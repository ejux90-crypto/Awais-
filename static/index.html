<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPulse | High-Yield Medical MCQ Quiz Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfeff',
                            100: '#cffaff',
                            200: '#a5f3fc',
                            300: '#67e8f9',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            800: '#155e75',
                            900: '#164e63',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-hover {
            transition: all 0.25s ease-in-out;
        }
        .glass-card-hover:hover {
            transform: translateY(-3px);
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.15);
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover {
            background-color: rgba(51, 65, 85, 0.9);
            border-color: #06b6d4;
        }
        .option-btn.selected {
            background-color: rgba(6, 182, 212, 0.15);
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 px-4 lg:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-teal-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid font-bold text-slate-950 text-xl fa-heart-pulse"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-cyan-300 bg-clip-text text-transparent">MedPulse</span>
                <span class="text-xs font-semibold text-cyan-400 bg-cyan-950/80 border border-cyan-800/50 px-2 py-0.5 rounded-full ml-2">HY Boards</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="navigateTo('home')" class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
                <i class="fa-solid fa-house text-cyan-400"></i> Quizzes
            </button>
            <button onclick="navigateTo('admin')" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 hover:bg-cyan-500/20 transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-user-shield text-cyan-400"></i> Admin Portal
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="app-container" class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <!-- Views will be dynamically rendered here -->
    </main>

    <!-- Global Toast Notification -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Image Modal for ECG View -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-12 right-0 text-slate-400 hover:text-white text-2xl p-2">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modal-img-src" src="" alt="ECG Diagram" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain border border-slate-700 bg-slate-950">
            <p id="modal-img-caption" class="text-slate-300 text-sm mt-3 font-medium bg-slate-900/80 px-4 py-1.5 rounded-full border border-slate-800"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-slate-500 text-xs mt-auto">
        <p>MedPulse High-Yield Residency Quiz Engine &bull; Built for Medical Residents & Practitioners</p>
    </footer>

    <!-- Frontend Application Script -->
    <script>
        // Application State
        const state = {
            currentView: 'home',
            quizzes: [],
            activeQuiz: null,
            participantName: '',
            currentQuestionIndex: 0,
            userAnswers: {}, // { question_id: selected_option_int }
            activeSubmission: null,
            adminSubmissions: []
        };

        // Navigation
        function navigateTo(view, params = {}) {
            state.currentView = view;
            window.location.hash = `#${view}${params.id ? '/' + params.id : ''}`;
            renderView(params);
        }

        // Router handler
        window.addEventListener('hashchange', handleHashRouting);

        function handleHashRouting() {
            const hash = window.location.hash.replace('#', '');
            if (!hash) {
                renderView();
                return;
            }
            const parts = hash.split('/');
            const view = parts[0];
            const id = parts[1];
            
            if (view === 'quiz' && id) {
                loadAndStartQuiz(id);
            } else if (view === 'results' && id) {
                loadSubmissionResults(id);
            } else if (view === 'admin') {
                renderAdminView();
            } else {
                renderHomeView();
            }
        }

        // Init App
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                handleHashRouting();
            } else {
                renderHomeView();
            }
        });

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
                             type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
                             'bg-cyan-950/90 border-cyan-500 text-cyan-200';
            
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border ${bgClass} shadow-xl backdrop-blur-md text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-info text-cyan-400'}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Image Modal
        function openImageModal(imgUrl, caption = 'High-Yield Clinical / ECG Image') {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-img-src');
            const cap = document.getElementById('modal-img-caption');
            img.src = imgUrl;
            cap.innerText = caption;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Render Control
        function renderView(params = {}) {
            const hash = window.location.hash.replace('#', '');
            if (hash.startsWith('quiz/')) {
                const id = hash.split('/')[1];
                loadAndStartQuiz(id);
            } else if (hash.startsWith('results/')) {
                const id = hash.split('/')[1];
                loadSubmissionResults(id);
            } else if (hash === 'admin') {
                renderAdminView();
            } else {
                renderHomeView();
            }
        }

        // API Helpers
        async function fetchQuizzes() {
            try {
                const res = await fetch('/api/quizzes');
                const data = await res.json();
                state.quizzes = data.quizzes || [];
                return state.quizzes;
            } catch (err) {
                showToast('Failed to load quizzes', 'error');
                return [];
            }
        }

        // ==================== VIEW 1: HOME PORTAL ====================
        async function renderHomeView() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center py-10">
                    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-cyan-950/60 border border-cyan-800/60 text-cyan-300 text-xs font-semibold uppercase tracking-wider mb-4 shadow-sm">
                        <i class="fa-solid fa-graduation-cap"></i> Board-Style High-Yield Assessment
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4 leading-tight">
                        Medical MCQ Quiz Portal
                    </h1>
                    <p class="text-slate-400 text-base md:text-lg max-w-2xl font-normal leading-relaxed mb-8">
                        Test your clinical knowledge across high-yield board topics, real ECG patterns, clinical practice guidelines, and resident-level cases.
                    </p>
                </div>

                <div id="quiz-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="col-span-full text-center py-12 text-slate-500">
                        <i class="fa-solid fa-spinner fa-spin text-2xl text-cyan-400 mb-2"></i>
                        <p>Loading available quizzes...</p>
                    </div>
                </div>
            `;

            const quizzes = await fetchQuizzes();
            const grid = document.getElementById('quiz-grid');

            if (!quizzes || quizzes.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">No quizzes available yet. Use Admin Portal to create one!</div>`;
                return;
            }

            grid.innerHTML = quizzes.map(q => {
                const icon = q.category === 'Cardiology' ? 'fa-heart-pulse text-rose-400' :
                             q.category === 'Infectious Diseases' ? 'fa-virus text-amber-400' : 'fa-dna text-teal-400';
                
                const shareUrl = `${window.location.origin}/#quiz/${q.id}`;

                return `
                    <div class="glass-card glass-card-hover rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden group">
                        <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-cyan-500/5 rounded-full blur-xl group-hover:bg-cyan-500/15 transition-all"></div>
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700/60">
                                    <i class="fa-solid ${icon} mr-1.5"></i> ${q.category || 'General'}
                                </span>
                                <span class="text-xs font-semibold text-cyan-400 bg-cyan-950/80 px-2.5 py-1 rounded-md border border-cyan-800/40">
                                    ${q.question_count} Questions
                                </span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2 leading-snug group-hover:text-cyan-300 transition-colors">${q.title}</h3>
                            <p class="text-slate-400 text-sm line-clamp-3 mb-6 leading-relaxed font-normal">${q.description}</p>
                        </div>

                        <div class="space-y-2.5 pt-4 border-t border-slate-800/80">
                            <button onclick="startQuizDirectly('${q.id}')" class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                                Take Quiz <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <button onclick="copyShareLink('${shareUrl}')" class="w-full py-2 px-3 rounded-lg font-medium text-xs text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 transition flex items-center justify-center gap-2 border border-slate-700/50">
                                <i class="fa-solid fa-share-nodes text-cyan-400"></i> Copy Shareable Link
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copyShareLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('Unique Quiz Link copied to clipboard!', 'success');
            }).catch(() => {
                showToast('Copied: ' + url, 'info');
            });
        }

        // ==================== VIEW 2: QUIZ REGISTRATION & EXECUTION ====================
        async function loadAndStartQuiz(quizId) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-cyan-400 mb-3"></i>
                    <p class="text-slate-400 font-medium">Loading Quiz Data...</p>
                </div>
            `;

            try {
                const res = await fetch(`/api/quizzes/${quizId}`);
                if (!res.ok) throw new Error('Quiz not found');
                const data = await res.json();
                state.activeQuiz = data.quiz;
                state.currentQuestionIndex = 0;
                state.userAnswers = {};

                if (!state.participantName) {
                    renderParticipantNamePrompt();
                } else {
                    renderQuizQuestionView();
                }
            } catch (err) {
                showToast('Error loading quiz', 'error');
                renderHomeView();
            }
        }

        function startQuizDirectly(quizId) {
            window.location.hash = `#quiz/${quizId}`;
        }

        function renderParticipantNamePrompt() {
            const container = document.getElementById('app-container');
            const quiz = state.activeQuiz;

            container.innerHTML = `
                <div class="max-w-md mx-auto py-12">
                    <div class="glass-card rounded-2xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden">
                        <div class="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-2xl font-bold mb-6 mx-auto">
                            <i class="fa-solid fa-user-doctor"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-center text-white mb-1">${quiz.title}</h2>
                        <p class="text-xs text-center text-cyan-400 font-semibold mb-6 uppercase tracking-wider">${quiz.questions.length} High-Yield Questions</p>
                        
                        <form onsubmit="submitParticipantName(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Participant Name</label>
                                <input type="text" id="participant-name-input" required placeholder="e.g. Dr. Awais Bhatti" 
                                    class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-sm">
                                <p class="text-xs text-slate-400 mt-1.5">Your name will be saved with your final score on the leaderboard.</p>
                            </div>
                            <button type="submit" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 shadow-lg shadow-cyan-500/20 hover:from-cyan-400 hover:to-teal-400 transition-all flex items-center justify-center gap-2">
                                Begin Assessment <i class="fa-solid fa-play"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;

            setTimeout(() => {
                document.getElementById('participant-name-input')?.focus();
            }, 100);
        }

        function submitParticipantName(e) {
            e.preventDefault();
            const input = document.getElementById('participant-name-input');
            const name = input.value.trim();
            if (!name) return;
            state.participantName = name;
            renderQuizQuestionView();
        }

        function renderQuizQuestionView() {
            const container = document.getElementById('app-container');
            const quiz = state.activeQuiz;
            const qIndex = state.currentQuestionIndex;
            const question = quiz.questions[qIndex];
            const totalQ = quiz.questions.length;
            const progressPct = Math.round(((qIndex + 1) / totalQ) * 100);
            const selectedOpt = state.userAnswers[question.id];

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6">
                    <!-- Progress Bar Header -->
                    <div class="glass-card rounded-xl p-4 flex items-center justify-between border border-slate-800">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Participant:</span>
                            <span class="text-sm font-semibold text-cyan-300 bg-cyan-950/80 px-2.5 py-0.5 rounded-md border border-cyan-800/50">${state.participantName}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-bold text-slate-300">Question ${qIndex + 1} of ${totalQ}</span>
                            <div class="w-32 h-2 bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full bg-gradient-to-r from-cyan-500 to-teal-400 transition-all duration-300" style="width: ${progressPct}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="glass-card rounded-2xl p-6 md:p-8 border border-slate-800 shadow-2xl relative">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider bg-cyan-950/80 px-2.5 py-1 rounded-md border border-cyan-800/40">
                                Question ${qIndex + 1}
                            </span>
                            ${question.image_url ? '<span class="text-xs font-semibold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50"><i class="fa-solid fa-image mr-1"></i> ECG / Clinical Image Included</span>' : ''}
                        </div>

                        <h3 class="text-lg md:text-xl font-bold text-white mb-6 leading-relaxed">
                            ${question.question_text}
                        </h3>

                        <!-- Image display if available -->
                        ${question.image_url ? `
                            <div class="mb-6 rounded-xl overflow-hidden border border-slate-700 bg-slate-950 p-2 relative group cursor-pointer" onclick="openImageModal('${question.image_url}', 'ECG Diagram for Question ${qIndex + 1}')">
                                <img src="${question.image_url}" alt="Clinical Diagram" class="w-full max-h-80 object-contain rounded-lg">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-sm font-semibold gap-2">
                                    <i class="fa-solid fa-magnifying-glass-plus text-cyan-400 text-lg"></i> Click to Zoom High-Res ECG
                                </div>
                            </div>
                        ` : ''}

                        <!-- Options List -->
                        <div class="space-y-3 mb-8">
                            ${question.options.map((optText, optIdx) => {
                                const letters = ['A', 'B', 'C', 'D'];
                                const isSelected = selectedOpt === optIdx;
                                return `
                                    <button onclick="selectOption(${question.id}, ${optIdx})" 
                                        class="option-btn w-full p-4 rounded-xl text-left border text-sm font-medium flex items-center justify-between ${isSelected ? 'selected' : 'border-slate-800 bg-slate-900/60 text-slate-200'}">
                                        <div class="flex items-center gap-3">
                                            <span class="w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center ${isSelected ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-400'}">
                                                ${letters[optIdx]}
                                            </span>
                                            <span>${optText}</span>
                                        </div>
                                        ${isSelected ? '<i class="fa-solid fa-circle-check text-cyan-400 text-base"></i>' : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- Navigation Bar -->
                        <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                            <button onclick="prevQuestion()" ${qIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2 text-sm text-slate-500 font-semibold"' : 'class="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2"'}>
                                <i class="fa-solid fa-chevron-left"></i> Previous
                            </button>

                            ${qIndex === totalQ - 1 ? `
                                <button onclick="submitCompleteQuiz()" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-2">
                                    Submit Quiz & View Results <i class="fa-solid fa-check"></i>
                                </button>
                            ` : `
                                <button onclick="nextQuestion()" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2">
                                    Next Question <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function selectOption(questionId, optionIdx) {
            state.userAnswers[questionId] = optionIdx;
            renderQuizQuestionView();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.activeQuiz.questions.length - 1) {
                state.currentQuestionIndex++;
                renderQuizQuestionView();
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                renderQuizQuestionView();
            }
        }

        async function submitCompleteQuiz() {
            const quiz = state.activeQuiz;
            const unanswered = quiz.questions.filter(q => state.userAnswers[q.id] === undefined);
            if (unanswered.length > 0) {
                if (!confirm(`You have ${unanswered.length} unanswered question(s). Are you sure you want to submit?`)) {
                    return;
                }
            }

            showToast('Submitting answers and calculating score...', 'info');

            try {
                const res = await fetch('/api/submissions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quiz_id: quiz.id,
                        participant_name: state.participantName,
                        answers: state.userAnswers
                    })
                });

                if (!res.ok) throw new Error('Submission failed');
                const data = await res.json();
                
                showToast('Quiz submitted successfully!', 'success');
                window.location.hash = `#results/${data.submission_id}`;
            } catch (err) {
                showToast('Error submitting quiz', 'error');
            }
        }

        // ==================== VIEW 3: RESULTS & EXPLANATIONS ====================
        async function loadSubmissionResults(submissionId) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-cyan-400 mb-3"></i>
                    <p class="text-slate-400 font-medium">Calculating score & fetching medical explanations...</p>
                </div>
            `;

            try {
                const res = await fetch(`/api/submissions/${submissionId}`);
                if (!res.ok) throw new Error('Result not found');
                const data = await res.json();
                state.activeSubmission = data.submission;
                renderResultsView();
            } catch (err) {
                showToast('Error loading submission result', 'error');
                renderHomeView();
            }
        }

        function renderResultsView() {
            const container = document.getElementById('app-container');
            const sub = state.activeSubmission;

            const badgeTitle = sub.percentage >= 85 ? 'Attending Master' :
                               sub.percentage >= 70 ? 'Senior Resident' :
                               sub.percentage >= 50 ? 'Junior Resident' : 'Needs Review';
            
            const badgeColor = sub.percentage >= 70 ? 'from-emerald-500 to-teal-400 text-slate-950' :
                               sub.percentage >= 50 ? 'from-amber-500 to-orange-400 text-slate-950' :
                               'from-rose-500 to-red-400 text-white';

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-8 py-6">
                    <!-- Score Summary Banner -->
                    <div class="glass-card rounded-3xl p-8 border border-slate-800 text-center relative overflow-hidden shadow-2xl">
                        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-2xl"></div>
                        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-teal-500/10 rounded-full blur-2xl"></div>
                        
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider bg-gradient-to-r ${badgeColor} shadow-md mb-4">
                            <i class="fa-solid fa-award mr-1"></i> ${badgeTitle}
                        </span>

                        <h2 class="text-3xl font-extrabold text-white mb-2">${sub.quiz_title}</h2>
                        <p class="text-slate-400 text-sm mb-6">Participant: <span class="text-cyan-300 font-bold">${sub.participant_name}</span></p>

                        <div class="flex items-center justify-center gap-8 py-4 border-y border-slate-800/80 my-4">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Score</span>
                                <span class="text-4xl font-extrabold text-white">${sub.score} <span class="text-lg font-bold text-slate-500">/ ${sub.total_questions}</span></span>
                            </div>
                            <div class="h-10 w-px bg-slate-800"></div>
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Percentage</span>
                                <span class="text-4xl font-extrabold text-cyan-400">${sub.percentage}%</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-3 pt-2">
                            <button onclick="navigateTo('home')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-2 border border-slate-700">
                                <i class="fa-solid fa-house"></i> Quiz Home
                            </button>
                            <button onclick="startQuizDirectly('${sub.quiz_id}')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 hover:from-cyan-400 hover:to-teal-400 transition flex items-center gap-2 shadow-lg shadow-cyan-500/20">
                                <i class="fa-solid fa-rotate-right"></i> Retake Quiz
                            </button>
                        </div>
                    </div>

                    <!-- Question Review Section -->
                    <div class="space-y-6">
                        <h3 class="text-xl font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-cyan-400"></i> Detailed Question Breakdown & Clinical Explanations
                        </h3>

                        ${sub.review.map((item, idx) => {
                            const isCorrect = item.is_correct === 1;
                            const letters = ['A', 'B', 'C', 'D'];

                            return `
                                <div class="glass-card rounded-2xl p-6 border ${isCorrect ? 'border-emerald-800/40 bg-slate-900/60' : 'border-rose-800/40 bg-slate-900/60'} shadow-lg space-y-4">
                                    <div class="flex items-start justify-between gap-4">
                                        <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md ${isCorrect ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'} flex items-center gap-1.5">
                                            <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-rose-400'}"></i>
                                            Q${idx + 1}: ${isCorrect ? 'Correct' : 'Incorrect'}
                                        </span>
                                    </div>

                                    <h4 class="text-base font-bold text-white leading-relaxed">${item.question_text}</h4>

                                    ${item.image_url ? `
                                        <div class="rounded-xl overflow-hidden border border-slate-700 bg-slate-950 p-2 cursor-pointer" onclick="openImageModal('${item.image_url}', 'ECG Review Q${idx + 1}')">
                                            <img src="${item.image_url}" alt="ECG Diagram" class="w-full max-h-64 object-contain rounded-lg">
                                        </div>
                                    ` : ''}

                                    <!-- Options Review -->
                                    <div class="space-y-2 pt-2">
                                        ${item.options.map((optText, optIdx) => {
                                            const isUserChoice = item.selected_option === optIdx;
                                            const isRightChoice = item.correct_option === optIdx;

                                            let styleClass = 'border-slate-800/80 bg-slate-900/40 text-slate-400';
                                            if (isRightChoice) {
                                                styleClass = 'border-emerald-500/80 bg-emerald-950/40 text-emerald-200 font-semibold';
                                            } else if (isUserChoice && !isRightChoice) {
                                                styleClass = 'border-rose-500/80 bg-rose-950/40 text-rose-200 font-semibold';
                                            }

                                            return `
                                                <div class="p-3.5 rounded-xl border text-sm flex items-center justify-between ${styleClass}">
                                                    <div class="flex items-center gap-3">
                                                        <span class="w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center ${isRightChoice ? 'bg-emerald-500 text-slate-950' : isUserChoice ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-500'}">
                                                            ${letters[optIdx]}
                                                        </span>
                                                        <span>${optText}</span>
                                                    </div>
                                                    <div class="flex items-center gap-2">
                                                        ${isUserChoice ? '<span class="text-xs px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-semibold">Your Selection</span>' : ''}
                                                        ${isRightChoice ? '<span class="text-xs px-2 py-0.5 rounded bg-emerald-900/80 border border-emerald-700 text-emerald-300 font-bold"><i class="fa-solid fa-check mr-1"></i> Correct Answer</span>' : ''}
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>

                                    <!-- Clinical Explanation Box -->
                                    <div class="mt-4 p-4 rounded-xl bg-slate-950/80 border border-cyan-900/50 text-xs md:text-sm text-slate-300 leading-relaxed space-y-1">
                                        <div class="font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5 mb-1">
                                            <i class="fa-solid fa-lightbulb"></i> Clinical Explanation & Rationale:
                                        </div>
                                        <p>${item.explanation}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // ==================== VIEW 4: ADMIN PORTAL ====================
        function getAdminPassword() {
            return sessionStorage.getItem('adminPassword') || '';
        }

        async function renderAdminView() {
            const container = document.getElementById('app-container');
            const savedPassword = getAdminPassword();

            if (!savedPassword) {
                renderAdminLoginPrompt();
                return;
            }

            container.innerHTML = `
                <div class="space-y-8 py-4">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
                        <div>
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/80 border border-cyan-800/50 text-cyan-300 text-xs font-semibold uppercase tracking-wider mb-2">
                                <i class="fa-solid fa-user-shield"></i> Administration & Analytics
                            </div>
                            <h2 class="text-3xl font-extrabold text-white">Admin Dashboard</h2>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="sessionStorage.removeItem('adminPassword'); renderAdminView();" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-rose-300 bg-rose-950/60 border border-rose-800 hover:bg-rose-900 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-lock"></i> Lock Admin
                            </button>
                            <button onclick="showCreateQuizModal()" class="px-4 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 hover:from-cyan-400 hover:to-teal-400 transition flex items-center gap-2 shadow-lg shadow-cyan-500/20">
                                <i class="fa-solid fa-plus"></i> Create New Quiz
                            </button>
                        </div>
                    </div>

                    <!-- Participant Leaderboard & Submissions Table -->
                    <div class="glass-card rounded-2xl p-6 border border-slate-800 shadow-xl space-y-4">
                        <h3 class="text-lg font-bold text-white flex items-center justify-between">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-users text-cyan-400"></i> Participant Submissions Log</span>
                            <span id="sub-count-badge" class="text-xs font-semibold text-slate-400 bg-slate-800 px-2.5 py-1 rounded-md">Loading...</span>
                        </h3>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-slate-300">
                                <thead class="bg-slate-900/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                                    <tr>
                                        <th class="p-3.5">Participant Name</th>
                                        <th class="p-3.5">Quiz Title</th>
                                        <th class="p-3.5">Score</th>
                                        <th class="p-3.5">Percentage</th>
                                        <th class="p-3.5">Submitted At</th>
                                        <th class="p-3.5 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-submissions-tbody" class="divide-y divide-slate-800/60">
                                    <tr>
                                        <td colspan="6" class="text-center py-8 text-slate-500">Loading submissions...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Create Quiz Modal -->
                <div id="create-quiz-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
                    <div class="glass-card rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 border border-slate-800 shadow-2xl relative" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
                            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-folder-plus text-cyan-400"></i> Create Custom MCQ Quiz
                            </h3>
                            <button onclick="closeCreateQuizModal()" class="text-slate-400 hover:text-white p-1">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <form onsubmit="handleCreateQuizSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Quiz Title</label>
                                <input type="text" id="new-quiz-title" required placeholder="e.g. Pulmonology & Critical Care High-Yield"
                                    class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Category</label>
                                <input type="text" id="new-quiz-category" placeholder="e.g. Pulmonology"
                                    class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Description</label>
                                <textarea id="new-quiz-desc" rows="2" placeholder="Brief description of topics covered..."
                                    class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-400"></textarea>
                            </div>

                            <div class="border-t border-slate-800 pt-4">
                                <h4 class="text-sm font-bold text-white mb-3 flex items-center justify-between">
                                    <span>First MCQ Question</span>
                                </h4>
                                <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Question Text</label>
                                        <input type="text" id="new-q-text" required placeholder="Enter MCQ question..."
                                            class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Image URL (Optional)</label>
                                        <input type="text" id="new-q-img" placeholder="e.g. /static/images/your-ecg.png"
                                            class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs">
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Option A</label>
                                            <input type="text" id="new-opt-0" required class="w-full px-3 py-1.5 rounded bg-slate-950 border border-slate-700 text-white text-xs">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Option B</label>
                                            <input type="text" id="new-opt-1" required class="w-full px-3 py-1.5 rounded bg-slate-950 border border-slate-700 text-white text-xs">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Option C</label>
                                            <input type="text" id="new-opt-2" required class="w-full px-3 py-1.5 rounded bg-slate-950 border border-slate-700 text-white text-xs">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Option D</label>
                                            <input type="text" id="new-opt-3" required class="w-full px-3 py-1.5 rounded bg-slate-950 border border-slate-700 text-white text-xs">
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Correct Option</label>
                                            <select id="new-correct-opt" class="w-full px-3 py-1.5 rounded bg-slate-950 border border-slate-700 text-white text-xs">
                                                <option value="0">Option A</option>
                                                <option value="1">Option B</option>
                                                <option value="2">Option C</option>
                                                <option value="3">Option D</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Clinical Explanation</label>
                                        <textarea id="new-q-exp" rows="2" placeholder="Clinical reasoning and rationale..."
                                            class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                                <button type="button" onclick="closeCreateQuizModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Cancel</button>
                                <button type="submit" class="px-5 py-2 rounded-xl font-bold text-xs bg-cyan-500 text-slate-950 hover:bg-cyan-400">Save Quiz</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            loadAdminSubmissions();
        }

        function renderAdminLoginPrompt() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-md mx-auto py-16">
                    <div class="glass-card rounded-3xl p-8 border border-slate-800 shadow-2xl text-center relative overflow-hidden">
                        <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-3xl font-bold mb-6 mx-auto">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-white mb-2">Admin Portal Restricted</h2>
                        <p class="text-slate-400 text-xs mb-6">Enter password to view participant submission logs and access the quiz editor.</p>

                        <form onsubmit="handleAdminAuth(event)" class="space-y-4 text-left">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Admin Password</label>
                                <input type="password" id="admin-pass-input" required placeholder="Enter password..."
                                    class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-400">
                            </div>
                            <button type="submit" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 hover:from-cyan-400 hover:to-teal-400 transition-all flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
                                Unlock Admin Portal <i class="fa-solid fa-key"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;

            setTimeout(() => {
                document.getElementById('admin-pass-input')?.focus();
            }, 100);
        }

        async function handleAdminAuth(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value.trim();
            if (!pass) return;

            try {
                const res = await fetch('/api/admin/submissions', {
                    headers: { 'X-Admin-Password': pass }
                });

                if (res.status === 401) {
                    showToast('Incorrect Admin Password', 'error');
                    return;
                }

                sessionStorage.setItem('adminPassword', pass);
                showToast('Admin Portal Unlocked!', 'success');
                renderAdminView();
            } catch (err) {
                showToast('Authentication error', 'error');
            }
        }

        async function loadAdminSubmissions() {
            try {
                const res = await fetch('/api/admin/submissions', {
                    headers: { 'X-Admin-Password': getAdminPassword() }
                });

                if (res.status === 401) {
                    sessionStorage.removeItem('adminPassword');
                    renderAdminView();
                    return;
                }

                const data = await res.json();
                const subs = data.submissions || [];
                
                document.getElementById('sub-count-badge').innerText = `${subs.length} Total Submissions`;
                const tbody = document.getElementById('admin-submissions-tbody');

                if (subs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">No participant submissions recorded yet. Share a quiz link with colleagues!</td></tr>`;
                    return;
                }

                tbody.innerHTML = subs.map(s => {
                    const dateStr = new Date(s.submitted_at).toLocaleString();
                    const badgeColor = s.percentage >= 70 ? 'bg-emerald-950 text-emerald-300 border-emerald-800' : 'bg-rose-950 text-rose-300 border-rose-800';

                    return `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="p-3.5 font-bold text-white">${s.participant_name}</td>
                            <td class="p-3.5 text-slate-300 font-medium">${s.quiz_title}</td>
                            <td class="p-3.5 font-semibold text-slate-200">${s.score} / ${s.total_questions}</td>
                            <td class="p-3.5">
                                <span class="px-2 py-0.5 rounded text-xs font-bold border ${badgeColor}">${s.percentage}%</span>
                            </td>
                            <td class="p-3.5 text-xs text-slate-400">${dateStr}</td>
                            <td class="p-3.5 text-right">
                                <button onclick="window.location.hash='#results/${s.id}'" class="text-xs font-semibold text-cyan-400 hover:underline">
                                    View Breakdown
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                showToast('Failed to load admin submissions', 'error');
            }
        }

        async function handleCreateQuizSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('new-quiz-title').value.trim();
            const category = document.getElementById('new-quiz-category').value.trim();
            const description = document.getElementById('new-quiz-desc').value.trim();

            const question = {
                question_text: document.getElementById('new-q-text').value.trim(),
                image_url: document.getElementById('new-q-img').value.trim() || null,
                options: [
                    document.getElementById('new-opt-0').value.trim(),
                    document.getElementById('new-opt-1').value.trim(),
                    document.getElementById('new-opt-2').value.trim(),
                    document.getElementById('new-opt-3').value.trim()
                ],
                correct_option: parseInt(document.getElementById('new-correct-opt').value),
                explanation: document.getElementById('new-q-exp').value.trim()
            };

            try {
                const res = await fetch('/api/admin/quizzes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': getAdminPassword()
                    },
                    body: JSON.stringify({ title, category, description, questions: [question] })
                });

                if (!res.ok) throw new Error('Failed to create quiz');
                showToast('New Quiz created successfully!', 'success');
                closeCreateQuizModal();
                renderHomeView();
            } catch (err) {
                showToast('Error creating quiz', 'error');
            }
        }
    </script>
</body>
</html>
